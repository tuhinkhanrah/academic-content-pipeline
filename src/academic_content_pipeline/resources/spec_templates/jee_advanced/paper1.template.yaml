# Structure based on prompts/instructions/jee_advanced/paper1.md.
schema_version: '1.0'
exam_name: JEE Advanced
paper_title: Paper 1
chapter_generation:
  enabled: true
  max_questions_per_request: 15
total_marks: 180
paper_instructions:
  - This paper has Mathematics, Physics, and Chemistry sections.
  - Follow the marking scheme for each question type.
  - Numerical answers must follow the configured two-decimal-place truncation rule.
  - Matching-list questions must contain List-I with four entries and List-II with five entries, followed by four candidate combinations with exactly one correct option.
instruction_profile:
  exam:
    name: JEE Advanced
    paper_name: Paper 1
    total_marks: 180
  global_instructions:
    - Generate exactly 16 questions for each of Mathematics, Physics, and Chemistry.
    - Follow the section-specific question counts and marking rules below.
    - For multiple-correct questions, one or more options may be correct; implement the stated partial-credit and negative-marking rules.
    - Numerical answers must be entered as values truncated to at most two decimal places.
    - Each matching-list set is one single-correct MCQ with four List-I entries and five List-II entries.
  generation_policy:
    question_count_mode: exact
    require_standalone_questions: true
    require_solution: true
    randomize_options: true
    vary_correct_option_position: true
    allow_question_type_substitution: false
  calibration:
    style:
      - conceptually rigorous
      - multi-step reasoning
      - syllabus-bound
    calculation_level: high
    avoid:
      - trivial recall
      - ambiguous wording
      - out-of-syllabus concepts
  sections:
    - id: mathematics_single_correct
      name: Single Correct Option
      subject: Mathematics
      question_count: 4
      question_types:
        - type: standard_mcq
          count: 4
      scoring:
        correct: 3
        incorrect: -1
        unanswered: 0
    - id: physics_single_correct
      name: Single Correct Option
      subject: Physics
      question_count: 4
      question_types:
        - type: diagram_image
          count: 3
        - type: statement_based_2
          count: 1
      scoring:
        correct: 3
        incorrect: -1
        unanswered: 0
    - id: chemistry_single_correct
      name: Single Correct Option
      subject: Chemistry
      question_count: 4
      question_types:
        - type: standard_mcq
          count: 1
        - type: diagram_image
          count: 1
        - type: statement_based_2
          count: 1
        - type: statement_based_3
          count: 1
      scoring:
        correct: 3
        incorrect: -1
        unanswered: 0
    - id: multiple_correct
      name: One or More Than One Correct Option
      subject: all
      question_count: 4
      question_types:
        - type: multiple_correct
          count: 4
      scoring:
        correct: 4
        incorrect: -1
        unanswered: 0
        partial: true
        partial_rules:
          - Award +3 when all four options are correct and exactly three correct options are selected.
          - Award +2 when at least three options are correct and exactly two correct options are selected.
          - Award +1 when at least two options are correct and exactly one correct option is selected.
          - Award 0 when no option is selected; otherwise apply -1 for any other selection.
    - id: numerical
      name: Numerical Value
      subject: all
      question_count: 4
      question_types:
        - type: numerical
          count: 4
      scoring:
        correct: 4
        incorrect: 0
        unanswered: 0
      answer_format:
        kind: numeric
        decimal_places: 2
        rounding: truncate
    - id: matching_lists
      name: Matching List Sets
      subject: all
      question_count: 4
      question_types:
        - type: match_list
          count: 4
      scoring:
        correct: 4
        incorrect: -1
        unanswered: 0
