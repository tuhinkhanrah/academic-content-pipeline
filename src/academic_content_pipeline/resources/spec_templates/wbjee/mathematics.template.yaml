# Structure based on prompts/instructions/wbjee/mathematics.md.
schema_version: '1.0'
exam_name: WBJEE
paper_title: Mathematics
duration_minutes: 120
total_marks: 100
paper_instructions:
  - This is the Mathematics paper, with 75 questions and full marks of 100.
  - Category 1 has 50 single-correct questions worth 1 mark each; an incorrect or multiple response deducts 0.25 marks.
  - Category 2 has 15 single-correct questions worth 2 marks each; an incorrect or multiple response deducts 0.5 marks.
  - Category 3 has 10 multiple-correct questions worth up to 2 marks each. Incorrect selections receive zero; partial credit is awarded for selecting only correct options.
instruction_profile:
  exam:
    name: WBJEE
    paper_name: Mathematics
    duration_minutes: 120
    total_marks: 100
  global_instructions:
    - Generate exactly 75 Mathematics questions.
    - Preserve the category numbering and question-type counts.
    - Category 3 permits one or more correct options. Award full marks only when all correct options are selected; award zero if any incorrect option is selected; otherwise award partial marks using 2 multiplied by the number of correct options selected, divided by the total number of correct options.
    - Questions should be clear, syllabus-bound, and suitable for the specified category.
  generation_policy:
    question_count_mode: exact
    require_standalone_questions: true
    require_solution: true
    randomize_options: true
    vary_correct_option_position: true
    allow_question_type_substitution: false
  calibration:
    style:
      - application-oriented
      - concept-focused
      - syllabus-bound
    calculation_level: moderate
    avoid:
      - trivial recall
      - ambiguous wording
      - out-of-syllabus concepts
  sections:
    - id: category_1
      name: Category 1 - Mathematics
      subject: Mathematics
      question_count: 50
      question_types:
        - type: standard_mcq
          count: 50
      scoring:
        correct: 1
        incorrect: -0.25
        unanswered: 0
    - id: category_2
      name: Category 2 - Mathematics
      subject: Mathematics
      question_count: 15
      question_types:
        - type: standard_mcq
          count: 15
      scoring:
        correct: 2
        incorrect: -0.5
        unanswered: 0
    - id: category_3
      name: Category 3 - Mathematics
      subject: Mathematics
      question_count: 10
      question_types:
        - type: multiple_correct
          count: 10
      scoring:
        correct: 2
        incorrect: 0
        unanswered: 0
        partial: true
        partial_rules:
          - Award partial marks as 2 times the number of correct options selected divided by the total number of correct options, only when every selected option is correct.
          - Award zero if any incorrect option is selected.
